name: check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parse:
    name: syntax, launchers, vendored addon
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs.Count -gt 0) {
              $bad++
              Write-Host "::error file=$($_.FullName),line=$($errs[0].Extent.StartLineNumber)::$($errs[0].Message)"
            }
            else { Write-Host "ok $($_.Name)" }
          }
          if ($bad -gt 0) { exit 1 }

      - name: Node script parses
        run: node --check scripts/godot-mcp-probe.mjs

      - name: Batch launchers use CRLF
        shell: pwsh
        run: |
          # cmd.exe is happiest with CRLF, and these wrappers are the first thing
          # a beginner runs - a stray LF there is a silent trap.
          $files = Get-ChildItem -Recurse -Filter *.cmd
          if ($files.Count -eq 0) { throw 'no .cmd files found' }
          foreach ($f in $files) {
            $bytes = [IO.File]::ReadAllBytes($f.FullName)
            $lf = 0; $crlf = 0
            for ($i = 0; $i -lt $bytes.Length; $i++) {
              if ($bytes[$i] -eq 10) { $lf++; if ($i -gt 0 -and $bytes[$i-1] -eq 13) { $crlf++ } }
            }
            if ($lf -ne $crlf) { throw "$($f.Name) has $($lf - $crlf) bare LF line endings" }
            Write-Host "ok: $($f.Name) ($crlf CRLF lines)"
          }

      - name: Vendored addon is a complete copy
        shell: pwsh
        run: |
          $required = @('plugin.cfg', 'godot_mcp.gd', 'mcp_bridge.gd', 'command_router.gd', 'mcp_runtime_probe.gd')
          foreach ($f in $required) {
            if (-not (Test-Path "addon/godot_mcp/$f")) { throw "missing addon/godot_mcp/$f" }
          }
          if (-not (Test-Path 'addon/LICENSE')) { throw 'addon/LICENSE is missing (MIT attribution required)' }
          $count = (Get-ChildItem 'addon/godot_mcp' -Recurse -File).Count
          Write-Host "ok: $count addon files"

  test:
    name: installer, config and uninstaller behaviour (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Two separate clean Windows machines on every run. windows-2022 also
        # carries an older PowerShell 5.1 build than windows-2025, so a fix that
        # only works on a newer build shows up here instead of on a user's PC.
        os: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Runner image
        shell: pwsh
        run: |
          Write-Host "os:         ${{ matrix.os }}"
          Write-Host "windows:    $([Environment]::OSVersion.Version)"
          Write-Host "powershell: $($PSVersionTable.PSVersion) $($PSVersionTable.PSEdition)"

      # Runs the real scripts in throwaway directories. No Godot, no uv install,
      # no server start, no binding of 9090/9080. The suite ends with an
      # isolation audit that fails if anything outside the temp tree changed.
      - name: Regression tests (Windows PowerShell 5.1)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\run-tests.ps1
          exit $LASTEXITCODE

      # The suite says it also runs under PowerShell 7; prove it on every run
      # rather than trusting the comment. The scripts under test still run in
      # Windows PowerShell 5.1, which is what users have.
      - name: Regression tests (PowerShell 7)
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File tests/run-tests.ps1
          exit $LASTEXITCODE
