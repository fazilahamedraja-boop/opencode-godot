name: check

on:
  push:
  pull_request:

jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs.Count -gt 0) {
              $bad++
              Write-Host "::error file=$($_.FullName),line=$($errs[0].Extent.StartLineNumber)::$($errs[0].Message)"
            }
            else { Write-Host "ok $($_.Name)" }
          }
          if ($bad -gt 0) { exit 1 }

      - name: Node script parses
        run: node --check scripts/godot-mcp-probe.mjs

      - name: Batch launcher uses CRLF
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes('scripts/godot-mcp-service.cmd')
          $lf = 0; $crlf = 0
          for ($i = 0; $i -lt $bytes.Length; $i++) {
            if ($bytes[$i] -eq 10) { $lf++; if ($i -gt 0 -and $bytes[$i-1] -eq 13) { $crlf++ } }
          }
          if ($lf -ne $crlf) { throw "godot-mcp-service.cmd has $($lf - $crlf) bare LF line endings" }
          Write-Host "ok: $crlf CRLF lines"

      - name: Vendored addon is a complete copy
        shell: pwsh
        run: |
          $required = @('plugin.cfg', 'godot_mcp.gd', 'mcp_bridge.gd', 'command_router.gd', 'mcp_runtime_probe.gd')
          foreach ($f in $required) {
            if (-not (Test-Path "addon/godot_mcp/$f")) { throw "missing addon/godot_mcp/$f" }
          }
          if (-not (Test-Path 'addon/LICENSE')) { throw 'addon/LICENSE is missing (MIT attribution required)' }
          $count = (Get-ChildItem 'addon/godot_mcp' -Recurse -File).Count
          Write-Host "ok: $count addon files"
